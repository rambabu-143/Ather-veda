    <style>
      :root {
        --ink: #18181b;
        --accent: #a05708;
        --bg: #ffffff;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--bg);
      }
      #stage {
        position: relative;
        width: 1920px;
        height: 1080px;
        background: var(--bg);
      }
      .clip {
        position: absolute;
        inset: 0;
      }
      .scene-content {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      /* the user's finished logo design — an abstract "AV" mark (A + a
         checkmark-like V swoosh), recolored to the site's exact palette
         (ink A, amber V). The designer's dark badge background was removed
         per a follow-up request — this is the mark alone, no box around it. */
      .mark-wrap {
        position: relative;
        width: 500px;
        height: 348px;
      }
      .mark-glow {
        position: absolute;
        top: calc(50% - 220px);
        left: calc(50% - 220px);
        width: 440px;
        height: 440px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(160, 87, 8, 0.35) 0%, rgba(160, 87, 8, 0) 70%);
        opacity: 0;
        pointer-events: none;
      }
      .mark-svg {
        position: relative;
        z-index: 1;
        overflow: visible;
      }
      /* draw phase: trace the letterform outlines like a pen, then settle into
         the real solid shapes — same technique proven on the wordmark before */
      .mark-a-outline {
        fill: none;
        stroke: var(--ink);
        stroke-width: 1.4;
        stroke-linecap: round;
        stroke-linejoin: round;
        opacity: 0;
      }
      .mark-v-outline {
        fill: none;
        stroke: var(--accent);
        stroke-width: 1.4;
        stroke-linecap: round;
        stroke-linejoin: round;
        opacity: 0;
      }
      .mark-a-fill {
        fill: var(--ink);
        opacity: 0;
      }
      .mark-v-fill {
        fill: var(--accent);
        opacity: 0;
      }
    </style>

    <script>
      window.__timelines = window.__timelines || {};

      function setupOutline(id) {
        var p = document.getElementById(id);
        var len = p.getTotalLength();
        p.style.strokeDasharray = String(len);
        p.style.strokeDashoffset = String(len);
        return p;
      }
      var aOutline = setupOutline("mark-a-outline");
      var vOutline0 = setupOutline("mark-v-outline-0");
      var vOutline1 = setupOutline("mark-v-outline-1");

      var tl = gsap.timeline({ paused: true });

      // lead-in 0.00–0.15, then "A" is drawn stroke-by-stroke (real outline of the
      // shape, not a placeholder line) — slow and deliberate: 0.15–0.70
      tl.fromTo(aOutline, { opacity: 0 }, { opacity: 1, duration: 0.01 }, 0.15);
      tl.to(aOutline, { strokeDashoffset: 0, duration: 0.55, ease: "none" }, 0.15);

      // "A" settles from outline into the real solid letterform — 0.65–0.85
      tl.fromTo("#mark-a-fill", { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "power1.out" }, 0.65);
      tl.to(aOutline, { opacity: 0, duration: 0.2, ease: "power1.out" }, 0.65);

      // "V" draws next — the small tip first, then the long swoosh tail, the same
      // order a pen would naturally trace it — 0.75–1.3
      tl.fromTo([vOutline0, vOutline1], { opacity: 0 }, { opacity: 1, duration: 0.01 }, 0.75);
      tl.to(vOutline0, { strokeDashoffset: 0, duration: 0.2, ease: "none" }, 0.75);
      tl.to(vOutline1, { strokeDashoffset: 0, duration: 0.35, ease: "none" }, 0.95);

      // "V" settles into its solid amber fill — 1.25–1.45
      tl.fromTo(["#mark-v-fill-0", "#mark-v-fill-1"], { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "power1.out" }, 1.25);
      tl.to([vOutline0, vOutline1], { opacity: 0, duration: 0.2, ease: "power1.out" }, 1.25);

      // glow bloom: single pulse once the whole mark has landed, no repeat — 1.4–1.9
      tl.fromTo(
        ".mark-glow",
        { opacity: 0, scale: 0.6 },
        { opacity: 1, scale: 1.15, duration: 0.2, ease: "power2.out" },
        1.4,
      );
      tl.to(".mark-glow", { opacity: 0, scale: 1.4, duration: 0.35, ease: "power2.out" }, 1.6);

      // hold_breath: settle to a still mark through the end of the composition — 2.0–3.0
      tl.to(".mark-wrap", { scale: 1.015, duration: 1.0, ease: "sine.inOut" }, 2.0);

      window.__timelines["aetherveda-intro"] = tl;
      tl.seek(0);
    </script>
