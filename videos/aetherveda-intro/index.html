    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      :root {
        --ink: #18181b;
        --accent: #a05708;
        --accent-hover: #834707;
        --accent-secondary: #c2690a;
        --border: #e4e4e7;
        --bg: #ffffff;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--bg);
      }
      #stage {
        position: relative;
        width: 1920px;
        height: 1080px;
        background: var(--bg);
        font-family: "Hind", ui-sans-serif, sans-serif;
      }
      .clip {
        position: absolute;
        inset: 0;
      }
      .scene-content {
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 120px 160px;
        gap: 28px;
        box-sizing: border-box;
      }

      /* mark */
      /* v3 logo grid is 48x48 (square), same as v2 -> rendered at 4.5x -> 216x216px.
         Ring + leaf only now (no separate baseline element). */
      .mark-wrap {
        position: relative;
        width: 216px;
        height: 216px;
      }
      .mark-glow {
        position: absolute;
        top: calc(50% - 160px);
        left: calc(50% - 160px);
        width: 320px;
        height: 320px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(241, 161, 75, 0.35) 0%, rgba(160, 87, 8, 0) 70%);
        opacity: 0;
        pointer-events: none;
      }
      .mark-svg {
        position: relative;
        z-index: 1;
        overflow: visible;
      }
      .mark-stroke {
        fill: none;
        stroke: var(--ink);
        stroke-width: 3;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      #mark-leaf {
        opacity: 0;
        transform-origin: 24px 24px;
      }

      /* lockup */
      .lockup {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
      }
      .wordmark {
        /* container itself always visible; each child opacity-gates on its own
           (The / handwritten AetherVeda / Foundation land as three separate beats) */
        display: flex;
        flex-wrap: nowrap;
        align-items: baseline;
        justify-content: center;
        gap: 14px;
        font-family: "Hind", ui-sans-serif, sans-serif;
        font-weight: 600;
        font-size: 64px;
        color: var(--ink);
        letter-spacing: -0.01em;
        text-align: center;
        white-space: nowrap;
      }
      .wm-plain {
        opacity: 0;
      }
      .wm-signature-svg {
        display: inline-block;
        overflow: visible;
        position: relative;
        /* Baseline alignment: viewBox is 0 0 348 92, real glyph outlines (extracted
           from the actual Dancing Script Bold font via opentype.js) sit on baseline
           y=74 within it. Distance from that baseline to the box's bottom edge =
           92 - 74 = 18px, so shifting the SVG down 18px lands the glyphs' true
           baseline on the row's shared baseline where "The" / "Foundation" sit. */
        top: 18px;
      }
      /* real letterform outlines (not a webfont <text> node) so they can be
         traced with stroke-dashoffset like a pen, then settled into a filled word */
      .wm-signature-stroke {
        fill: none;
        stroke: var(--accent);
        stroke-width: 2.5;
        stroke-linecap: round;
        stroke-linejoin: round;
        opacity: 0;
      }
      .wm-signature-fill {
        fill: var(--accent);
        stroke: none;
        opacity: 0;
      }
      .tagline {
        opacity: 0;
        font-family: "Hind", ui-sans-serif, sans-serif;
        font-weight: 500;
        font-size: 30px;
        color: var(--accent);
        text-align: center;
        white-space: nowrap;
      }
      .underline {
        width: 420px;
        height: 4px;
        background: var(--accent);
        transform-origin: left center;
        transform: scaleX(0);
        margin-top: 4px;
      }
    </style>
  </head>

    <script>
      window.__timelines = window.__timelines || {};

      // rules/svg-path-draw: measure real geometry, never guess.
      // Fill-shape leaf is not stroke-drawable — ignited via scale/opacity instead (see below).
      var ringPath = document.getElementById("mark-ring");
      var ringLen = ringPath.getTotalLength();
      ringPath.style.strokeDasharray = String(ringLen);
      ringPath.style.strokeDashoffset = String(ringLen);

      // Real handwriting draw-on (Apple "Hello"-style), not a per-character opacity
      // stagger: each wm-sig-sub-N path is one contour of the actual Dancing Script
      // Bold glyph outlines for "AetherVeda", extracted from the live font file via
      // opentype.js (font.getPath().toPathData()), split on "M" into its 15 separate
      // subpaths (10 letters, some with an inner counter contour, e.g. "e"/"a"/"d").
      // IMPORTANT: stroke-dasharray/dashoffset restarts its pattern at every subpath
      // ("M") boundary per the SVG spec — a single dashoffset animation across one
      // combined multi-subpath path does NOT reveal it progressively (most contours
      // render fully visible immediately regardless of offset, verified empirically).
      // So each subpath gets its own getTotalLength()-based dasharray/dashoffset and
      // its own GSAP tween, sequenced back-to-back in DOM order (= the font's own
      // left-to-right stroke order) with each subpath's share of the total draw time
      // proportional to its own length — i.e. constant pen speed across the whole word,
      // not equal time per letter (a wide "V" legitimately takes longer to trace than
      // the dot-like top of an "i" would).
      // #mark-signature-fill is an identical-geometry filled copy the strokes settle
      // into once fully drawn, so the word reads as clean solid type at rest, not an
      // outline.
      var sigSubs = Array.prototype.slice.call(document.querySelectorAll(".wm-signature-stroke"));
      var sigSubLens = sigSubs.map(function (p) {
        var len = p.getTotalLength();
        p.style.strokeDasharray = String(len);
        p.style.strokeDashoffset = String(len);
        return len;
      });
      var sigTotalLen = sigSubLens.reduce(function (a, b) { return a + b; }, 0);

      var tl = gsap.timeline({ paused: true });

      // lead-in 0.00–0.15, then ring draw-on: single continuous stroke, 0.15–0.75
      tl.fromTo(
        ringPath,
        { strokeDashoffset: ringLen },
        { strokeDashoffset: 0, duration: 0.6, ease: "power2.out" },
        0.15,
      );

      // leaf ignition: scale_grow (0.7->1) + fade, slight overlap with the ring's tail: 0.65–1.00
      tl.fromTo(
        "#mark-leaf",
        { opacity: 0, scale: 0.7 },
        { opacity: 1, scale: 1, duration: 0.35, ease: "power2.out" },
        0.65,
      );

      // glow bloom: single pulse peaking on-beat at 1.15s, no repeat — window 1.00–1.45
      tl.fromTo(
        ".mark-glow",
        { opacity: 0, scale: 0.6 },
        { opacity: 1, scale: 1.15, duration: 0.15, ease: "power2.out" },
        1.0,
      );
      tl.to(".mark-glow", { opacity: 0, scale: 1.4, duration: 0.3, ease: "power2.out" }, 1.15);

      // "The " fade: 1.55–1.80
      tl.fromTo(".wm-the", { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power1.out" }, 1.55);

      // "AetherVeda" is drawn stroke-by-stroke, pen-writing style: 1.85–2.85 (1.0s —
      // slow enough to actually read as handwriting, matching the pace of Apple's
      // "Hello" reveal rather than a quick typewriter pop). Linear speed per subpath:
      // real pens don't ease per letter, and constant speed across the whole word
      // (not equal time per letter) is what sells the "being written" illusion.
      tl.fromTo(sigSubs, { opacity: 0 }, { opacity: 1, duration: 0.01 }, 1.85);
      var DRAW_START = 1.85;
      var DRAW_DURATION = 1.0;
      var cumulativeLen = 0;
      sigSubs.forEach(function (p, i) {
        var len = sigSubLens[i];
        var startAt = DRAW_START + (cumulativeLen / sigTotalLen) * DRAW_DURATION;
        var dur = Math.max((len / sigTotalLen) * DRAW_DURATION, 0.02);
        tl.to(p, { strokeDashoffset: 0, duration: dur, ease: "none" }, startAt);
        cumulativeLen += len;
      });

      // settle: the drawn strokes crossfade into the solid filled word once written — 2.85–3.05
      tl.fromTo("#mark-signature-fill", { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "power1.out" }, 2.85);
      tl.to(sigSubs, { opacity: 0, duration: 0.2, ease: "power1.out" }, 2.85);

      // " Foundation" fade, right after the signature settles: 2.95–3.25
      tl.fromTo(".wm-foundation", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power1.out" }, 2.95);

      // tagline fade: 3.15–3.55
      tl.fromTo(".tagline", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power1.out" }, 3.15);

      // underline sweep, landing on-beat at 4.05s: 3.65–4.05
      tl.fromTo(".underline", { scaleX: 0 }, { scaleX: 1, duration: 0.4, ease: "power2.out" }, 3.65);

      // hold_breath: settle to a still lockup through the end of the composition (4.05–5.00)
      tl.to(".lockup", { scale: 1.015, duration: 0.95, ease: "sine.inOut" }, 4.05);

      window.__timelines["aetherveda-intro"] = tl;
      tl.seek(0);
    </script>
  </body>
